[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only limitlesspa.org itself may show these pages in a frame (the CMS live
    # preview does); every other site is blocked, which prevents clickjacking.
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# www -> apex
[[redirects]]
  from = "https://www.limitlesspa.org/*"
  to = "https://limitlesspa.org/:splat"
  status = 301
  force = true
