eyebrow: For businesses
title: Welcome every kid — and every family who comes with them.
intro: Families of kids with special needs are loyal customers when they find a
  place that works. Listing with Limitless PA is free, and becoming
  sensory-friendly is easier than you might think.
stat_number: 1 in 31
stat_text: U.S. children are identified with autism, according to the CDC. Many
  more kids have sensory sensitivities. Their families are in your community
  right now.
why_title: Why it matters
why_body: For many families, everyday errands take a lot of planning. When a
  parent isn’t sure a place will be patient with their child, they often just
  don’t go. A few small changes, and letting families know about them, can turn
  your business into the place they come back to again and again.
ideas_eyebrow: Simple ideas
ideas_title: Small changes, mostly free
ideas_intro: You don’t need to do all of these. Pick one or two that fit your
  business and start there.
ideas:
  - icon: clock
    title: Offer quiet times
    text: Choose a time when it’s usually less busy. If you can, lower the music,
      soften the lights, or limit announcements.
  - icon: calendar
    title: Make visits easier to plan
    text: Let families book ahead, ask questions before they arrive or schedule a
      walkthrough. A little extra time and flexibility can make planning feel
      easier.
  - icon: headphones
    title: Keep a few comfort items handy
    text: Noise-reducing headphones, simple fidget items or a weighted throw to
      borrow may help some guests feel more comfortable.
  - icon: sparkle
    title: Help families know what to expect
    text: Share photos of your entrance, waiting area, or what happens during a
      visit.
  - icon: heart
    title: Empower your team
    text: A conversation about welcoming different needs can help staff respond with
      patience, flexibility, and respect.
  - icon: people
    title: Offer a place to pause
    text: A chair or quieter corner away from the activity can give someone space to
      take a break and return when they’re ready.
steps_eyebrow: Getting listed
steps_title: How it works
steps:
  - title: Tell us what you offer.
    text: Fill out a short form about your business and accommodations.
  - title: We follow up.
    text: We’ll confirm the details with you, and can share ideas if you’re just
      getting started.
  - title: Welcome to the Limitless Business Network.
    text: You’re part of the Limitless Network—at no cost. Once we confirm the
      details and you choose to join, we’ll list your business on the Limitless
      website and provide brochures, table tents, and a Limitless Business
      Network window decal that identifies your business as a participating
      partner.
  - title: Share your events.
    text: Hosting a sensory-friendly hour or special event? We’ll help spread the
      word.
cta_title: Ready to be listed?
cta_text: It takes about five minutes.
cta_note: Questions first? [Contact us](/contact/).
