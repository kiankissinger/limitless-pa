eyebrow: About Limitless PA
title: Connecting Families. Celebrating Inclusion. Strengthening Community.
intro: >-
  Created in partnership with the John B. Gunter Leadership Program and the
  Cambria Regional Chamber of Commerce, Limitless connects families of children
  and young adults with disabilities to welcoming places, activities, events,
  and resources in their community.


  We believe everyone deserves the chance to feel included, build friendships, explore interests, discover new passions, and take part in community life. By sharing local opportunities and information about available accommodations, we help families find experiences that feel right for them.


  Because every child and young adult deserves the opportunity to explore, connect, and discover that a world of possibilities is waiting.
why_title: Why we started
why_body: >-
  Limitless was created with a simple belief: a child’s world should not be
  defined by the places that feel out of reach.


  A haircut, a trip to the store, or a birthday celebration can take extra planning when families aren’t sure what to expect or what support may be available. Limitless helps families find welcoming places and experiences, so children and young adults can make connections, explore what they love, and feel at home in their community.
do_title: What we do
do_items:
  - icon: search
    title: Find and share welcoming places.
    text: We collect businesses and venues that have made real sensory-friendly
      accommodations, and we check the details.
  - icon: calendar
    title: Promote inclusive events.
    text: Sensory-friendly showings, adaptive sports, meetups, and family events
      close to home.
  - icon: store
    title: Encourage businesses to adapt.
    text: We share simple, low-cost ideas that help any business welcome every kid.
  - icon: people
    title: Build community.
    text: Families’ experiences and recommendations can help others discover local
      places and activities
not_title: More room for connection
not_body: Limitless helps families discover more ways to spend time together,
  explore interests, build friendships, and take part in community life. We
  bring local places, activities, and events together, with helpful details so
  each family can decide what feels right for them.
how_title: How listings work
how_body: >-
  Anyone can suggest a place. Before we list it, we confirm what the business
  offers. Listings are free. Because

  programs change, we include the date we last checked each listing and always recommend calling ahead.
help_title: Ways to help
