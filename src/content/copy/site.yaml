footer_blurb: >-
  A free, community-built guide to the places, events, and people across Pennsylvania that make room for every
  kid.
newsletter_title: Get updates
newsletter_text: New places and events, now and then. No spam.
newsletter_button: Subscribe
disclaimer: >-
  **We are not medical providers.** Limitless PA shares community-sourced information about places, events,
  and everyday resources. Nothing on this site is medical, therapeutic, or legal advice. Accommodations can change, so
  please contact a business before you visit. In an emergency, call [911](tel:911). For mental health crisis
  support, call or text [988](tel:988).
