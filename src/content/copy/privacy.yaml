title: Privacy
intro: 'Short version: we only collect what you choose to send us, and we don’t sell or share it.'
body: |-
  ## What we collect

  When you fill out a form on this site — suggesting a place, sharing an event, or contacting us — we receive what you
  type into it, such as your name, email address, and message. We use it only to review your submission and, if
  needed, follow up with you.

  If you sign up for updates, we keep your email address only to send you news about Limitless PA. To stop getting
  emails, [contact us](/contact/) and we’ll remove you.

  ## What we don’t do

  - We don’t sell, rent, or trade your information.
  - We don’t use advertising trackers.
  - We don’t publish your name or email with a listing unless you ask us to.

  ## Services we use

  This site is hosted by Netlify, which also processes our form submissions. Fonts are served by Google Fonts. These
  providers may log basic technical information (like your IP address) to deliver the site.

  ## Children’s information

  Please don’t include your child’s full name, diagnosis, or other private health details in our forms. We don’t need
  them to add a listing.

  ## Questions

  Want us to delete something you sent? [Contact us](/contact/) and we’ll take care of it.
